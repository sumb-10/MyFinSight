# 배포판을 만들고(세 운영체제), 태그를 올렸을 때는 GitHub Release 까지 만든다.
#
#   v* 태그를 올리면      → 빌드 + Release (0.x 판과 -beta 같은 꼬리가 붙은 판은 pre-release)
#   패키징을 고친 PR      → 빌드만 (만든 파일은 그 실행 기록의 Artifacts 에 14일 남는다)
#   Actions 탭의 버튼     → 빌드만
#
# 빌드 방법은 여기 적지 않는다. packaging/build.py · release.py 가 PC 에서와 똑같이 한다 (packaging/README.md).
# 판 번호는 태그가 정한다 (손으로 적는 곳이 없다). 태그가 없는 커밋에서 만든 것은 이름이 dev 다.
# 판을 내는 순서: packaging/RELEASE_NOTES.md 에 "## v0.1.1 — 날짜" 절을 적어 main 에 병합
#                → git switch main && git pull && git tag v0.1.1 && git push origin v0.1.1
#
# 만드는 파일 (<버전> = 0.1.1 또는 dev):
#   MyFinSight-<버전>-windows.exe · -windows-folder.zip       Windows 실행 파일 (한 파일형 · 폴더형)
#   MyFinSight-<버전>-macos.zip · -macos-folder.tar.gz        macOS 실행 파일 (Apple Silicon, zip 안에 MyFinSight.command)
#   MyFinSight-<버전>-linux · -linux-folder.tar.gz            Linux 실행 파일 (x86_64)
#   MyFinSight-<버전>-source.zip                              스크립트 버전(run.bat · run.sh) + Docker Compose 버전
name: 배포판 빌드 · 릴리스

on:
  push:
    tags: ["v[0-9]*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "Front/pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # PR 에 새 커밋이 오면 앞의 빌드는 멈춘다. 태그 빌드는 끝까지 간다

env:
  PYTHONUTF8: "1" # 빌드 스크립트가 한글로 알린다 (Windows 서버의 기본 글자표로는 찍다가 멈춘다)
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "9" # Front/pnpm-lock.yaml 의 형식(9.0)을 읽는 판

jobs:
  # 몇 초면 끝난다. 태그로 시작했으면 오래 걸리는 빌드 전에 여기서 먼저 걸러 낸다
  check:
    name: 1. 버전 번호 · 릴리스 노트 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 이번 빌드에 붙을 버전 번호 보기 (태그가 없는 커밋이면 dev)
        run: echo "버전 번호 = $(python packaging/build.py --print-version)"
      - name: 태그와 버전 번호가 같은지, 릴리스 노트에 이 버전의 절이 있는지 (태그를 올렸을 때만)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(python packaging/build.py --print-version)" = "$GITHUB_REF_NAME"
          python packaging/release.py --notes "$GITHUB_REF_NAME"

  executables:
    name: 2. ${{ matrix.title }}
    needs: check
    strategy:
      fail-fast: false # 한 운영체제가 실패해도 나머지의 결과는 본다
      matrix:
        include:
          - name: windows
            os: windows-latest
            title: Windows 실행 파일 만들기 (windows.exe · windows-folder.zip)
          - name: macos
            os: macos-latest # Apple Silicon. 인텔 맥용은 만들지 않는다
            title: macOS 실행 파일 만들기 (macos.zip · macos-folder.tar.gz)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: pnpm 준비 (화면 라이브러리를 받는 도구)
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Node 준비 (화면 빌드)
        uses: actions/setup-node@v7
        with:
          node-version-file: Front/.nvmrc
          cache: pnpm
          cache-dependency-path: Front/pnpm-lock.yaml
      - name: 파이썬 라이브러리 설치
        run: pip install -e ".[analysis,packaging]"
      - name: 실행 파일 만들기 — 화면 빌드 → 한 파일형 · 폴더형으로 묶기 → 각각 켜 보기
        run: python packaging/build.py --all
      # 맨 실행 파일로 올렸던 v0.1.1 은 내려받으면 실행 권한이 빠져 맥에서 열리지 않았다 → zip 에 권한째 담는다.
      # 여기서 Finder 의 압축 풀기와 같은 도구(ditto)로 풀어, 두 번 누를 파일이 실행 권한을 갖고 실제로 켜지는지 본다
      - name: 맥용 zip 확인 — 맥의 압축 풀기로 풀어 MyFinSight.command 가 실행되는지
        if: matrix.name == 'macos'
        run: |
          zip_file=$(ls packaging/dist/*/MyFinSight-*-macos.zip)
          ditto -x -k "$zip_file" "$RUNNER_TEMP/unzipped"
          ls -l "$RUNNER_TEMP/unzipped"
          test -x "$RUNNER_TEMP/unzipped/MyFinSight.command"
          "$RUNNER_TEMP/unzipped/MyFinSight.command" --help
      - name: 만든 파일 보관 (이 실행 기록의 Artifacts → dist-${{ matrix.name }})
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: packaging/dist/
          if-no-files-found: error
          retention-days: 14

  # 리눅스 실행 파일은 오래된 배포판에서도 돌게 Docker 안(glibc 2.31)에서 만든다 → release.py --linux.
  # 묶음(source.zip)과 그 판의 릴리스 노트 사본도 여기서 나온다
  linux-and-source:
    name: 2. Linux 실행 파일 · source.zip 만들기 (linux · linux-folder.tar.gz · source.zip)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pnpm 준비 (화면 라이브러리를 받는 도구)
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Node 준비 (화면 빌드)
        uses: actions/setup-node@v7
        with:
          node-version-file: Front/.nvmrc
          cache: pnpm
          cache-dependency-path: Front/pnpm-lock.yaml
      - name: source.zip 과 Linux 실행 파일 만들기 — 화면 빌드 → 묶음 압축 → Docker 안에서 실행 파일 묶고 켜 보기
        run: python packaging/release.py --linux
      - name: 만든 파일 보관 (이 실행 기록의 Artifacts → dist-linux-and-source)
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-and-source
          path: packaging/dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 3. GitHub Release 게시 (태그를 올렸을 때만)
    needs: [executables, linux-and-source] # 하나라도 실패하면 Release 를 만들지 않는다
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Release 를 만들고 파일을 붙인다 (이 단계만 쓰기 권한을 갖는다)
    steps:
      - name: 세 빌드가 만든 파일 모으기
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true # 세 빌드의 dist/v0.1.1/ 이 한 폴더로 합쳐진다
      - name: Release 만들고 파일 7개 붙이기 (설명은 릴리스 노트의 이 버전 절)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la "dist/$TAG"   # 판 번호가 붙지 않은 빌드(dev)였다면 이 폴더가 없어 여기서 멈춘다
          title="MyFinSight ${TAG#v}"
          flags=""
          case "$TAG" in
            v0.* | *-*) flags="--prerelease"; title="$title (시험판)" ;;
          esac
          gh release create "$TAG" "dist/$TAG"/MyFinSight-* --verify-tag --title "$title" --notes-file "dist/$TAG/RELEASE_NOTES.md" $flags
